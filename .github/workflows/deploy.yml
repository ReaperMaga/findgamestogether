name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://findgamestogether.online

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NUXT_STEAM_API_KEY: ${{ secrets.NUXT_STEAM_API_KEY }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?GitHub secret CLOUDFLARE_API_TOKEN is required}"
          : "${CLOUDFLARE_ACCOUNT_ID:?GitHub secret CLOUDFLARE_ACCOUNT_ID is required}"
          : "${NUXT_STEAM_API_KEY:?GitHub secret NUXT_STEAM_API_KEY is required}"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Workers
        run: pnpm build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            NUXT_STEAM_API_KEY
        env:
          NUXT_STEAM_API_KEY: ${{ secrets.NUXT_STEAM_API_KEY }}
